
services:
  claude2gemini:
    build: .
    hostname: claude2gemini
    restart: always
    ports:
      - "8111:8080"
    volumes:
      # Antigravityの認証情報をホストと共有するためのマウント
      - ./.config/Antigravity:/root/.config/Antigravity
      # 開発時はソースコードをバインドマウントすると便利ですが、必要に応じてコメントアウトを外してください
      - ./:/app 
