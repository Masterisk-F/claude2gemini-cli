[project]
name = "claude2gemini"
version = "0.1.0"
description = "Claude API compatible proxy backed by Google Antigravity SDK"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "google-antigravity>=0.1.0",
    "sse-starlette>=2.2.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
